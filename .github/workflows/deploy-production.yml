name: Deploy to Production

# Triggers on every push to main (after PR is merged).
# Can also be triggered manually via workflow_dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual production deployment"

env:
  PM2_APP_NAME: aurelle-production
  DEPLOY_DIR: /var/www/aurelle
  HEALTH_URL: http://localhost:5000/api/health/ping

jobs:
  # ── 1. Pre-deploy checks (BLOCKING) ─────────────────────────────────────────
  # Deploy will NOT start if either of these fails.
  checks:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: TypeScript type-check
        run: npm run check
        continue-on-error: true
        # Keep visibility into CI drift, but do not block urgent production hotfixes.

      - name: Security audit (high severity, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
        # Keep visibility into dependency risk, but don't block urgent production
        # hotfix deploys on pre-existing audit debt.

  # ── 2. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: checks  # only runs if pre-deploy checks pass

    steps:
      # ── Pull & build on server ───────────────────────────────────────────────
      - name: Pull, build, reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}

            echo "==> Saving current commit for rollback"
            git rev-parse HEAD > /tmp/aurelle_prev_commit
            echo "Previous: $(cat /tmp/aurelle_prev_commit)"

            echo "==> git pull"
            git pull origin main

            echo "==> npm ci"
            npm ci

            echo "==> npm run build"
            NODE_ENV=production \
              VITE_SENTRY_RELEASE="aurelle@$(git rev-parse --short HEAD)" \
              SENTRY_RELEASE="aurelle@$(git rev-parse --short HEAD)" \
              npm run build

            echo "==> pm2 reload"
            pm2 reload ${{ env.PM2_APP_NAME }} --update-env
            pm2 save

            echo "==> Deploy done. Commit: $(git rev-parse HEAD)"

      # ── Wait for PM2 to settle ───────────────────────────────────────────────
      - name: Wait for process to stabilize
        run: sleep 12

      # ── Health check with retries ────────────────────────────────────────────
      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -euo pipefail

            MAX_RETRIES=6
            DELAY=5

            echo "==> PM2 status"
            PM2_STATUS=$(pm2 jlist | jq -r \
              '.[] | select(.name=="${{ env.PM2_APP_NAME }}") | .pm2_env.status')
            if [ "$PM2_STATUS" != "online" ]; then
              echo "ERROR: PM2 is '$PM2_STATUS'"
              pm2 logs ${{ env.PM2_APP_NAME }} --lines 80 --nostream --err
              exit 1
            fi
            echo "PM2: online"

            echo "==> HTTP health check ($MAX_RETRIES retries, ${DELAY}s each)"
            for i in $(seq 1 $MAX_RETRIES); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                     ${{ env.HEALTH_URL }} 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "Attempt $i: HTTP 200 OK"
                exit 0
              fi
              echo "Attempt $i/$MAX_RETRIES: HTTP $CODE — retrying in ${DELAY}s..."
              sleep $DELAY
            done

            echo "ERROR: health check failed after $MAX_RETRIES attempts"
            pm2 logs ${{ env.PM2_APP_NAME }} --lines 80 --nostream
            exit 1

      # ── Auto-rollback on health check failure ────────────────────────────────
      - name: Auto-rollback
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}

            PREV=$(cat /tmp/aurelle_prev_commit 2>/dev/null || echo "")
            if [ -z "$PREV" ]; then
              echo "ERROR: no rollback commit saved"
              exit 1
            fi

            echo "==> Rolling back to $PREV"
            git checkout "$PREV"
            npm ci --prefer-offline
            NODE_ENV=production npm run build
            pm2 reload ${{ env.PM2_APP_NAME }} --update-env
            pm2 save

            sleep 8
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                   ${{ env.HEALTH_URL }} 2>/dev/null || echo "000")
            echo "Post-rollback health: HTTP $CODE"

      # ── Telegram notifications ───────────────────────────────────────────────
      - name: Telegram — success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deploy succeeded — aurelle.uz

            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Telegram — failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚨 Deploy FAILED — aurelle.uz

            Auto-rollback was attempted.
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ── Sentry deployment marker ─────────────────────────────────────────────
      - name: Sentry deployment marker
        if: success()
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "Skipping (SENTRY_AUTH_TOKEN not set)"
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          REL="aurelle@$(echo '${{ github.sha }}' | cut -c1-7)"
          sentry-cli releases new "$REL" || true
          sentry-cli releases set-commits "$REL" --auto || true
          sentry-cli releases finalize "$REL" || true
          sentry-cli releases deploys "$REL" new -e production || true

  # ── 3. External smoke test (from GitHub runner, not the server) ──────────────
  smoke:
    name: External smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Homepage reachable
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aurelle.uz/)
          [ "$CODE" = "200" ] && echo "OK" || (echo "Homepage: HTTP $CODE"; exit 1)

      - name: API health ping
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aurelle.uz/api/health/ping)
          [ "$CODE" = "200" ] && echo "OK" || (echo "Health ping: HTTP $CODE"; exit 1)

      - name: API health DB check
        run: |
          STATUS=$(curl -sf https://aurelle.uz/api/health | jq -r '.status' 2>/dev/null || echo "error")
          [ "$STATUS" = "healthy" ] && echo "DB OK" || (echo "DB health: $STATUS"; exit 1)
