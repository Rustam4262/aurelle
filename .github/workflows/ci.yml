name: CI

# Runs on every PR to main/develop and on pushes to non-main branches.
# main is handled by deploy-production.yml (which runs its own checks first).
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches-ignore:
      - main  # main deploys via deploy-production.yml

jobs:
  # ── 1. TypeScript type-check (BLOCKING — PR cannot merge without this) ──────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run check
        # NO continue-on-error — this is a hard gate

  # ── 2. Security audit (BLOCKING — high-severity CVEs block the PR) ──────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --audit-level=high
        # Blocks on HIGH and CRITICAL CVEs only — moderate/low are advisory

  # ── 3. ESLint (advisory — informs but does not block) ───────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: typecheck  # only run lint if tsc passes (avoids noisy lint errors from type errors)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
        continue-on-error: true  # advisory: reported in PR but does not block merge
