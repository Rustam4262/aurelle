# HTTPS - Staging (staging.aurelle.uz)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.aurelle.uz;

    # Root directory
    root /var/www/aurelle-staging/dist/public;
    index index.html;

    # ============ SSL CONFIGURATION ============

    ssl_certificate /etc/letsencrypt/live/staging.aurelle.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.aurelle.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/staging.aurelle.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    ssl_dhparam /etc/nginx/dhparam.pem;

    # ============ SECURITY HEADERS ============

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============ LOGGING ============

    access_log /var/log/nginx/staging-access.log;
    error_log /var/log/nginx/staging-error.log warn;

    # ============ GZIP COMPRESSION ============

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # ============ API PROXY ============

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
