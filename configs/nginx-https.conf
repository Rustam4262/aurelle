# AURELLE Nginx HTTPS Configuration
# Optimized for SSL Labs A+ rating
# Generated: 2026-01-11

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# HTTP to HTTPS redirect for production
server {
    listen 80;
    listen [::]:80;
    server_name aurelle.uz www.aurelle.uz;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Production (aurelle.uz)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aurelle.uz www.aurelle.uz;

    # Root directory (for static files)
    root /var/www/aurelle/dist/public;
    index index.html;

    # ============ SSL CONFIGURATION ============

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/aurelle.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurelle.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/aurelle.uz/chain.pem;

    # SSL Protocols (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong Ciphers (Mozilla Modern configuration)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Diffie-Hellman parameter for DHE ciphersuites
    # Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048
    ssl_dhparam /etc/nginx/dhparam.pem;

    # ============ SECURITY HEADERS ============

    # HSTS (HTTP Strict Transport Security)
    # Tells browsers to always use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Clickjacking: DENY (aligned with CSP frame-ancestors 'none' below)
    add_header X-Frame-Options "DENY" always;

    # MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS protection (legacy, modern browsers use CSP)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    # ───────────────────────────────────────────────────────────
    # АРХИТЕКТУРА: nginx отдаёт index.html через try_files напрямую.
    # Этот заголовок — единственный CSP для HTML-страниц в production.
    # Helmet (server/index.ts) применяется только к /api/* proxy_pass.
    # При любом изменении CSP — синхронно менять ОБА файла.
    # Проверить: curl -sI https://aurelle.uz | grep -i content-security
    # ───────────────────────────────────────────────────────────
    add_header Content-Security-Policy "
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        frame-ancestors 'none';
        script-src 'self'
            https://api-maps.yandex.ru
            https://yastatic.net
            https://*.yastatic.net
            https://www.googletagmanager.com
            https://www.google-analytics.com;
        style-src 'self' 'unsafe-inline'
            https://fonts.googleapis.com
            https://yastatic.net
            https://*.yastatic.net;
        font-src 'self' data:
            https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        connect-src 'self'
            https://api-maps.yandex.ru
            https://geocode-maps.yandex.ru
            https://suggest-maps.yandex.ru
            https://*.maps.yandex.net
            https://yastatic.net
            https://*.yastatic.net
            https://*.sentry.io
            https://www.google-analytics.com
            https://www.googletagmanager.com
            wss:;
        worker-src blob:;
        frame-src https://www.googletagmanager.com;
    " always;

    # Permissions Policy (formerly Feature Policy)
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # ============ LOGGING ============

    access_log /var/log/nginx/aurelle-access.log;
    error_log /var/log/nginx/aurelle-error.log warn;

    # ============ GZIP COMPRESSION ============

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/font-woff
        application/font-woff2;

    # ============ API PROXY ============

    # Proxy to Node.js backend
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Cache control
        proxy_cache_bypass $http_upgrade;
    }

    # ============ STATIC FILES ============

    # Service Worker — must NEVER be cached (browsers cache-bust by comparing bytes).
    # WARNING: the general \.(js|...) regex below would match /sw.js and serve it
    # with "immutable" — which prevents browsers from ever detecting SW updates.
    # Exact match (=) has highest priority in Nginx and overrides the regex.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        access_log off;
    }

    # SPA entry point — must not be cached so browsers always get the latest
    # index.html (which references new content-hashed chunk URLs after a deploy).
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Handle React Router (SPA)
    location / {
        # Rate limiting
        limit_req zone=general_limit burst=50 nodelay;

        try_files $uri $uri/ /index.html;

        # Cache static assets (content-hashed by Vite → safe to cache forever)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (for monitoring)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

