;; PgBouncer Configuration for AURELLE Platform
;; Connection pooling for PostgreSQL to improve performance
;; Generated: 2026-01-11

;; ============ DATABASE CONNECTIONS ============

[databases]
; Database name = connection string
; Format: dbname = host=hostname port=port dbname=dbname

; Production database
aurelle = host=localhost port=5432 dbname=aurelle

; You can add more databases here
; aurelle_staging = host=localhost port=5432 dbname=aurelle_staging

;; ============ PGBOUNCER SETTINGS ============

[pgbouncer]

;;;
;;; Administrative settings
;;;

; PgBouncer listens on this address
listen_addr = 127.0.0.1

; PgBouncer listens on this port
listen_port = 6432

; Unix socket directory
;unix_socket_dir = /var/run/postgresql

; Unix socket mode
;unix_socket_mode = 0777

;;;
;;; Authentication settings
;;;

; Authentication type
; Options: md5, scram-sha-256, plain, trust, any, hba, cert, pam
auth_type = md5

; Authentication file (generated from PostgreSQL users)
auth_file = /etc/pgbouncer/userlist.txt

; HBA configuration file (optional)
;auth_hba_file = /etc/pgbouncer/pg_hba.conf

;;;
;;; User settings
;;;

; User to run as (should match PostgreSQL user)
;user = postgres

;;;
;;; Pooler personality
;;;

; Pooling mode
; Options:
;   session - connections returned to pool after client disconnects (default)
;   transaction - connections returned to pool after transaction finishes
;   statement - connections returned to pool after each statement (not recommended)
;
; Recommendation: transaction mode for best performance in web applications
pool_mode = transaction

;;;
;;; Connection limits
;;;

; Maximum number of client connections allowed
max_client_conn = 200

; Default pool size (connections per user+database pair)
; Recommendation: Start with 20-25 connections per database
default_pool_size = 25

; Minimum number of server connections to keep in pool
min_pool_size = 5

; Maximum number of server connections per user+database pair
; This should not exceed PostgreSQL's max_connections (default: 100)
; Leave some headroom for direct connections and maintenance
reserve_pool_size = 10

; Maximum time a connection is allowed to be in use (0 = disabled)
; Prevents connection leaks
reserve_pool_timeout = 3

; Maximum number of additional connections from reserve_pool
max_db_connections = 50

; Maximum number of connections per user
max_user_connections = 50

;;;
;;; Server connection behavior
;;;

; If server connection has been idle for this long, close it
server_idle_timeout = 600

; If server login has been in progress for this long, close it
server_connect_timeout = 15

; If server connection has been in "close_needed" mode for this long, close it
server_check_delay = 30

; Close server connection if it's been connected for this long (0 = disabled)
; Helps prevent long-lived connection issues
server_lifetime = 3600

; Query to check server connection is alive
; For PostgreSQL 9.6+, use pg_isready or SELECT 1
server_check_query = SELECT 1

;;;
;;; Client connection behavior
;;;

; Client connection timeout
client_idle_timeout = 0

; Disconnect clients who have been idle for this long (0 = disabled)
; Recommendation: 0 for web applications (let application handle timeouts)
client_login_timeout = 60

; Maximum time queries are allowed to wait for execution
; If client query has been in queue for this long, cancel it
query_timeout = 0

; Maximum time queries are allowed to run
; If query runs longer than this, it's canceled (0 = disabled)
query_wait_timeout = 120

;;;
;;; Timeouts
;;;

; Lifetime of idle connections in pool
; How long to keep released connections available for reuse
idle_transaction_timeout = 0

; DNS lookup timeout
dns_max_ttl = 15

; DNS lookup cache negative TTL
dns_nxdomain_ttl = 15

; DNS lookup timeout
dns_zone_check_period = 0

;;;
;;; Logging
;;;

; Log file location
; For systemd, use syslog or leave empty
logfile = /var/log/postgresql/pgbouncer.log

; Log verbosity
; 0 = normal, 1 = verbose
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Log stats every N seconds (0 = disabled)
stats_period = 60

; Log stats users (comma-separated)
;stats_users = stats, postgres

;;;
;;; Security and encryption
;;;

; TLS settings (optional, for encrypted connections)
;client_tls_sslmode = disable
;client_tls_ca_file = /path/to/ca.crt
;client_tls_cert_file = /path/to/client.crt
;client_tls_key_file = /path/to/client.key

;server_tls_sslmode = disable
;server_tls_ca_file = /path/to/ca.crt
;server_tls_cert_file = /path/to/server.crt
;server_tls_key_file = /path/to/server.key

;;;
;;; Administrative interface
;;;

; Administrative database for stats/control
; Connect via: psql -h 127.0.0.1 -p 6432 -U pgbouncer pgbouncer
admin_users = postgres

; Stats database access
;stats_users = stats, postgres

;;;
;;; Console access
;;;

; Users allowed to use admin console
;admin_users = postgres, admin

; Users allowed to view statistics
;stats_users = postgres, stats

;;;
;;; Connection sanity checks
;;;

; Abort if server response time exceeds this
;server_round_robin = 0

; Close server connections that have been idle for this long in seconds
;server_reset_query = DISCARD ALL

; Whether to reset query state on server release
;server_reset_query_always = 0

;;;
;;; Dangerous timeouts
;;;

; Do not set these unless you know what you're doing
;tcp_defer_accept = 0
;tcp_socket_buffer = 0
;tcp_keepalive = 1
;tcp_keepcnt = 0
;tcp_keepidle = 0
;tcp_keepintvl = 0

;;;
;;; Memory limits
;;;

; Maximum size of SQL statements (bytes)
max_packet_size = 2147483647

; Maximum size of startup packet
pkt_buf = 4096

; Size of internal buffer for data from server
sbuf_loopcnt = 5

; Maximum internal buffer size (0 = unlimited)
;so_reuseport = 0

;;;
;;; Special
;;;

; Disable internal connection pooling for specific databases
; Use this if you need session-level features
;ignore_startup_parameters = extra_float_digits

; Application name to send to server
;application_name_add_host = 0

;;;
;;; Console command settings
;;;

; Disable dangerous console commands
;disable_pqexec = 0
